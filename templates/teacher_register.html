<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Registration - ProctorAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Professional App Navigation -->
    <header class="app-navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
            </div>
            <span>PROCTOR<span style="color: var(--primary-light);">AI</span></span>
        </a>
        <div class="nav-right">
            <a href="/" class="subtle-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to Portal Selection
            </a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card register-card">
            
            <div class="card-header-area">
                <div class="card-header-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </div>
                <h2>Educator Registration</h2>
                <p>Register as an instructor to curate exams and review student scorecards</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST">
                
                <div class="form-group">
                    <label class="input-label" for="reg-name">Full Name</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <input id="reg-name" type="text" name="name" placeholder="e.g. Prof. Alan Turing" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label" for="reg-dept">Academic Department</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                            </svg>
                        </div>
                        <input id="reg-dept" type="text" name="department" placeholder="e.g. Computer Engineering" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label" for="reg-subject">Assigned Course / Subject</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
                                <path d="M6 6h10"></path>
                                <path d="M6 10h10"></path>
                            </svg>
                        </div>
                        <input id="reg-subject" type="text" name="subject" placeholder="e.g. Machine Learning, SEPM" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label" for="reg-password">Password</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input id="reg-password" type="password" name="password" placeholder="Create a secure password" required minlength="4">
                    </div>
                </div>

                <button type="submit" class="modern-btn" style="margin-top: 8px;">
                    <span>Complete Registration</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>

                <div class="form-footer">
                    <p>Already have an educator account? <a href="/teacher">Sign in here</a></p>
                </div>

            </form>

        </div>
    </main>

</body>
</html>
