<!DOCTYPE html>
<html>
<head>
    <title>Teacher Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="login-container">

    <div class="login-card">
        <h2>👩‍🏫 Teacher Login</h2>

        {% if error %}
        <div class="alert-error">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="alert-success">
            ✅ {{ success }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="input-group">
                <input type="text" name="name" placeholder="Enter Teacher Name" required autofocus>
            </div>

            <div class="input-group">
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <button type="submit" class="modern-btn">
                Login
            </button>

            <div class="form-footer">
                <p>New Teacher? <a href="/teacher_register">Register here</a></p>
                <p style="margin-top: 10px;"><a href="/" class="subtle-link">⬅ Back to Home</a></p>
            </div>

        </form>
    </div>

</div>

</body>
</html>
