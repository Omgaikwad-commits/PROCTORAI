<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- TensorFlow.js & COCO-SSD for Mobile / Cell Phone Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <!-- MediaPipe Face Mesh & Camera Utils for Face Presence, Iris & Eye Gaze Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script src="{{ url_for('static', filename='proctor.js') }}" defer></script>
</head>
<body>

<!-- 🔥 FIXED TIMER (Always Visible) -->
<div class="fixed-timer">
    ⏳ Time Remaining: 
    <span id="timer">30:00</span>
</div>

<div class="exam-wrapper">

    <div class="exam-container">

        <h1 class="exam-title">
            {{ subject }} Exam
        </h1>

        <!-- PROCTOR MONITORING BOX -->
        <div class="facecam-box">
            <div class="video-container">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="proctor-canvas"></canvas>
            </div>
            
            <!-- Real-time HUD Status Indicators -->
            <div class="proctor-hud">
                <div class="hud-item" id="hud-face">
                    <span class="hud-icon">👤</span>
                    <span class="hud-label">Face:</span>
                    <span class="hud-status status-loading" id="hud-face-text">Loading...</span>
                </div>
                <div class="hud-item" id="hud-eye">
                    <span class="hud-icon">👁️</span>
                    <span class="hud-label">Eye Gaze:</span>
                    <span class="hud-status status-loading" id="hud-eye-text">Loading...</span>
                </div>
                <div class="hud-item" id="hud-mobile">
                    <span class="hud-icon">📱</span>
                    <span class="hud-label">Mobile:</span>
                    <span class="hud-status status-loading" id="hud-mobile-text">Loading...</span>
                </div>
                <div class="hud-item hud-warnings" id="hud-warnings-badge">
                    <span class="hud-icon">⚠️</span>
                    <span class="hud-label">Warnings:</span>
                    <span class="hud-status status-warning-count" id="hud-warning-count">0 / 3</span>
                </div>
            </div>

            <!-- Toast / Alert Notification Container -->
            <div id="proctor-toast" class="proctor-toast hidden"></div>
        </div>

        <form method="POST">

            <input type="hidden" id="warnings" name="warnings" value="0">
            <input type="hidden" id="mobile_warnings" name="mobile_warnings" value="0">
            <input type="hidden" id="eye_warnings" name="eye_warnings" value="0">

            {% for q in questions %}
            <div class="question-card">
                <h3>{{ loop.index }}. {{ q[3] }}</h3>

                <label class="option">
                    <input type="radio" name="{{ q[0] }}" value="{{ q[4] }}" required>
                    <span>A) {{ q[4] }}</span>
                </label>

                <label class="option">
                    <input type="radio" name="{{ q[0] }}" value="{{ q[5] }}">
                    <span>B) {{ q[5] }}</span>
                </label>

                <label class="option">
                    <input type="radio" name="{{ q[0] }}" value="{{ q[6] }}">
                    <span>C) {{ q[6] }}</span>
                </label>

                <label class="option">
                    <input type="radio" name="{{ q[0] }}" value="{{ q[7] }}">
                    <span>D) {{ q[7] }}</span>
                </label>

            </div>
            {% endfor %}

            <button type="submit" class="submit-btn">
                Submit Exam
            </button>

        </form>

    </div>

</div>

<script>
    // ===== TIMER SETTINGS =====
    let totalTime = 30 * 60; // 30 minutes
    const timerElement = document.getElementById("timer");
    const examForm = document.querySelector("form");

    function updateTimer() {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;

        seconds = seconds < 10 ? "0" + seconds : seconds;

        timerElement.textContent = minutes + ":" + seconds;

        // 🔥 Turn red when 1 minute left
        if (totalTime <= 60) {
            timerElement.style.color = "red";
            timerElement.style.fontWeight = "bold";
        }

        if (totalTime <= 0) {
            clearInterval(timerInterval);
            alert("⏰ Time is up! Exam will be submitted automatically.");
            examForm.submit();
        }

        totalTime--;
    }

    updateTimer();
    const timerInterval = setInterval(updateTimer, 1000);
</script>

</body>
</html>
