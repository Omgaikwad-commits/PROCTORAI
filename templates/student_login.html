<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - ProctorAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Professional App Navigation -->
    <header class="app-navbar">
        <a href="/" class="brand-logo">
            <div class="brand-icon-box">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    <path d="m9 12 2 2 4-4"></path>
                </svg>
            </div>
            <span>PROCTOR<span style="color: var(--primary-light);">AI</span></span>
        </a>
        <div class="nav-right">
            <a href="/" class="subtle-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to Portal Selection
            </a>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            
            <div class="card-header-area">
                <div class="card-header-icon">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <h2>Student Candidate Login</h2>
                <p>Sign in with your roll number to access your proctored assessment</p>
            </div>

            {% if error %}
            <div class="alert-error">
                <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if success %}
            <div class="alert-success">
                <svg class="alert-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
                <span>{{ success }}</span>
            </div>
            {% endif %}

            <form method="POST">
                
                <div class="form-group">
                    <label class="input-label" for="student-roll">Official Roll Number</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                                <line x1="7" y1="8" x2="17" y2="8"></line>
                                <line x1="7" y1="12" x2="17" y2="12"></line>
                                <line x1="7" y1="16" x2="12" y2="16"></line>
                            </svg>
                        </div>
                        <input id="student-roll" type="text" name="roll_no" placeholder="e.g. CS-2024-04" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="input-label" for="student-password">Password</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input id="student-password" type="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>

                <!-- Subject Dropdown -->
                <div class="form-group">
                    <label class="input-label" for="exam-subject">Select Examination Subject</label>
                    <div class="input-field-wrapper">
                        <div class="input-field-icon">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
                                <path d="M6 6h10"></path>
                                <path d="M6 10h10"></path>
                            </svg>
                        </div>
                        <select id="exam-subject" name="subject" required>
                            <option value="">Choose an exam to begin</option>
                            {% for subject in subjects %}
                                <option value="{{ subject[0] }}">{{ subject[0] }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <button type="submit" class="modern-btn" style="margin-top: 8px;">
                    <span>Authenticate & Launch Exam</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>

                <div class="form-footer">
                    <p>First-time candidate? <a href="/student_register">Register here</a></p>
                </div>

            </form>

        </div>
    </main>

</body>
</html>
