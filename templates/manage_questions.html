<!DOCTYPE html>
<html>
<head>
    <title>Manage Questions</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='teacher.css') }}">
</head>
<body>

<div class="dashboard-container">

    <h1>📋 Manage Questions - {{ subject }}</h1>

    <a href="{{ url_for('teacher_dashboard') }}" class="btn">⬅ Back to Dashboard</a>

    <br><br>

    {% if questions %}

        <!-- ✅ NEW GRID CONTAINER -->
        <div class="questions-grid">

            {% for q in questions %}
            <div class="card">
                <h3>{{ loop.index }}. {{ q[3] }}</h3>

                <p><b>A)</b> {{ q[4] }}</p>
                <p><b>B)</b> {{ q[5] }}</p>
                <p><b>C)</b> {{ q[6] }}</p>
                <p><b>D)</b> {{ q[7] }}</p>

                <p><b>Correct Answer:</b> {{ q[8] }}</p>

                <a href="{{ url_for('delete_question', question_id=q[0]) }}"
                   class="btn logout-btn"
                   onclick="return confirm('Are you sure you want to delete this question?');">
                   🗑 Delete
                </a>
            </div>
            {% endfor %}

        </div>

    {% else %}
        <p>No questions created yet.</p>
    {% endif %}

</div>

</body>
</html>
